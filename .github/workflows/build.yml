name: Build Only (Manual)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            suffix: linux
          - os: windows-latest
            suffix: win
          - os: macos-latest
            suffix: mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version tag
        id: version
        run: echo "VERSION=build" >> $GITHUB_OUTPUT

      - name: Build executable
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name "AutoLogin-${{ matrix.suffix }}-${{ steps.version.outputs.VERSION }}" \
            --add-data "AutoNetworkLogin:AutoNetworkLogin" \
            --hidden-import PySide6 \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            --hidden-import yaml \
            --hidden-import psutil \
            --collect-all PySide6 \
            "AutoNetworkLogin/自动登录-V1.3.0-GUI框架迁移至PySide6-网卡绑定.py"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLogin-${{ matrix.suffix }}-${{ steps.version.outputs.VERSION }}
          path: dist/
